<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="查看 NotchFlow 的面板状态、模块截图与设置界面。">
    <title>体验 - NotchFlow</title>
    <link rel="icon" href="assets/notchflow-logo.png">
    <link rel="stylesheet" href="styles.css?v=20260615-layout">
    <script src="site.js?v=20260615-cn" defer></script>
  </head>
  <body data-page="experience">
    <header class="site-shell">
      <a class="brand" href="index.html" aria-label="NotchFlow 首页">
        <img src="assets/notchflow-logo.png" alt="" width="36" height="36">
        <span>NotchFlow</span>
      </a>
      <nav class="primary-nav" aria-label="主导航">
        <a href="experience.html" aria-current="page">体验</a>
        <a href="install.html">安装</a>
        <a href="release.html">发布说明</a>
        <a href="https://github.com/AICode-Nexus/NotchFlow">GitHub</a>
      </nav>
      <a class="nav-action" href="https://github.com/AICode-Nexus/NotchFlow/releases/latest">下载</a>
    </header>

    <main class="page-main">
      <section class="page-hero reveal">
        <p class="kicker">产品体验</p>
        <h1>三个状态，看清刘海工作流。</h1>
        <p>用更少文案展示更具体的界面：紧凑状态、模块展开、设置控制。</p>
      </section>

      <section class="shot-lab reveal" aria-labelledby="shot-title">
        <div class="shot-copy">
          <p class="kicker">截图切换</p>
          <h2 id="shot-title">在面板状态之间切换。</h2>
          <p>每个状态只讲一件事，让截图承担说明，页面保持克制。</p>
          <div class="segmented" role="tablist" aria-label="截图选择器">
            <button class="is-active" type="button" data-shot="panel" role="tab" aria-selected="true">面板</button>
            <button type="button" data-shot="modules" role="tab" aria-selected="false">模块</button>
            <button type="button" data-shot="settings" role="tab" aria-selected="false">设置</button>
          </div>
        </div>
        <div class="shot-frame">
          <img data-shot-image src="assets/notchflow-panel.png" alt="NotchFlow 展开面板截图" width="1400" height="920">
        </div>
      </section>

      <section class="feature-rail reveal" aria-label="后续入口">
        <a href="install.html">
          <span>安装</span>
          <strong>下载并启动预览版</strong>
        </a>
        <a href="release.html">
          <span>发布说明</span>
          <strong>了解 v0.1.2 包含内容</strong>
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <span>产品体验</span>
      <a href="index.html">返回首页</a>
    </footer>
  </body>
</html>
