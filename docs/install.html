    <link rel="icon" href="assets/notchflow-logo.png">

  <body data-page="install">
    <header class="site-shell">
      <a class="brand" href="index.html" aria-label="NotchFlow 首页">
        <img src="assets/notchflow-logo.png" alt="" width="36" height="36">
        <span>NotchFlow</span>
      </a>
      <nav class="primary-nav" aria-label="主导航">
        <a href="experience.html">体验</a>
        <a href="install.html" aria-current="page">安装</a>
        <a href="release.html">发布说明</a>

      </nav>
      <a class="nav-action" href="https://github.com/AICode-Nexus/NotchFlow/releases/latest">下载</a>
    </header>

    <main class="page-main">
      <section class="page-hero narrow reveal">
        <p class="kicker">安装</p>
        <h1>预览版，四步启动。</h1>
        <p>v0.1.0 目前为本地签名 zip 包，正式公证安装包仍在后续计划中。</p>
      </section>

      <section class="install-flow reveal" aria-label="安装步骤">
        <ol>
          <li>
            <span>01</span>
            <strong>下载</strong>
            <p>从最新 GitHub 发布页获取 <code>NotchFlow-v0.1.0-macOS.zip</code>。</p>
          </li>
          <li>
            <span>02</span>
            <strong>移动</strong>
            <p>解压后把 <code>NotchFlow.app</code> 放入 <code>/Applications</code>。</p>
          </li>
          <li>
            <span>03</span>
            <strong>打开</strong>
            <p>如果 macOS 首次拦截，请右键应用并选择 <b>打开</b>。</p>
          </li>
          <li>
            <span>04</span>
            <strong>授权</strong>
            <p>仅为需要的模块授权，例如定位、自动化或媒体控制。</p>
          </li>
        </ol>
        <div class="install-panel">
          <img src="assets/notchflow-settings.png" alt="NotchFlow 设置界面截图" width="1400" height="920">
        </div>
      </section>
    </main>

    <footer class="site-footer">
